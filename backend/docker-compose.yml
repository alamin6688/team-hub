version: "3.9"

services:
  app:
    build:
      context: .
      target: production
    container_name: backend_app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge
